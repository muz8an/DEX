name: DEX Multi-Platform Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS DESKTOP APPLICATION & INSTALLER (Windows Runner)
  # ============================================================================
  build-windows:
    name: Build Windows Application & Installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'

      - name: Compile and Test Desktop Application
        run: mvn clean test

      - name: Package Windows Fat JAR
        run: mvn package -DskipTests

      - name: Package Windows Executable & Installer via jpackage
        shell: powershell
        run: |
          & .\scripts\generate_icons.ps1
          & .\scripts\build_windows.ps1 -SkipTests

      - name: Verify Windows Artifacts
        shell: powershell
        run: |
          if (-not (Test-Path "assets\DEX.exe") -or (Get-Item "assets\DEX.exe").Length -le 0) {
            throw "DEX.exe is missing or 0 bytes!"
          }
          if (-not (Test-Path "assets\DEX-Setup.exe") -or (Get-Item "assets\DEX-Setup.exe").Length -le 0) {
            throw "DEX-Setup.exe is missing or 0 bytes!"
          }
          Write-Host "Windows build artifacts verified successfully."

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-windows-artifacts
          path: |
            assets/DEX.exe
            assets/DEX-Setup.exe
            assets/checksums.txt

  # ============================================================================
  # 2. ANDROID COMPANION APPLICATION (Ubuntu Runner)
  # ============================================================================
  build-android:
    name: Build Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Run Android Unit Tests
        working-directory: mobile
        run: ./gradlew test

      - name: Build Android Debug APK
        working-directory: mobile
        run: ./gradlew assembleDebug

      - name: Stage Android APK to assets/
        run: |
          mkdir -p assets
          cp mobile/app/build/outputs/apk/debug/app-debug.apk assets/DEX-Mobile.apk
          if [ ! -s assets/DEX-Mobile.apk ]; then
            echo "DEX-Mobile.apk is missing or empty!"
            exit 1
          fi
          sha256sum assets/DEX-Mobile.apk > assets/android_checksum.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-android-artifacts
          path: |
            assets/DEX-Mobile.apk
            assets/android_checksum.txt

  # ============================================================================
  # 3. CONSOLIDATE & OPTIONALLY PUBLISH RELEASE
  # ============================================================================
  release:
    name: Publish Release Artifacts
    needs: [build-windows, build-android]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dex-windows-artifacts
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dex-android-artifacts
          path: release-assets

      - name: Generate Unified Checksums
        working-directory: release-assets
        run: |
          sha256sum DEX.exe DEX-Setup.exe DEX-Mobile.apk > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-${{ github.run_number }}"
          name: "DEX Release v1.0.0 (Build ${{ github.run_number }})"
          draft: true
          prerelease: false
          files: |
            release-assets/DEX.exe
            release-assets/DEX-Setup.exe
            release-assets/DEX-Mobile.apk
            release-assets/checksums.txt
